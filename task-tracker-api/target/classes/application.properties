spring.application.name=task-tracker-api

# Application info exposed via /api/info
app.name=Task Tracker API
app.version=1.0.0

# Default task priority when not supplied in the request (LOW, MEDIUM, HIGH)
task.default-priority=MEDIUM

# Default page size for paginated list endpoints
pagination.default-page-size=10

# In-memory H2 database
spring.datasource.url=jdbc:h2:mem:tasktrackerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
